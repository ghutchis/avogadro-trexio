[project]
name = "avogadro-trexio"
version = "0.1.1"
description = "Read TREXIO wave function files (HDF5 back end) in Avogadro 2"
authors = [{name = "Geoff Hutchison", email = "geoff.hutchison@gmail.com"}]
license = "BSD-3-Clause"
dependencies = ["trexio>=2.6.1,<3", "numpy>=1.17.3"]
requires-python = ">= 3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
avogadro-trexio = "avogadro_trexio:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.10.2,<0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# --- Dependency updates ----------------------------------------------------

# .github/workflows/update-dependencies.yml checks daily for new releases of
# each package listed here: on PyPI for [project].dependencies and
# [tool.pixi.pypi-dependencies], on conda-forge for [tool.pixi.dependencies].
# A conda-forge release counts once it is built for every platform in
# [tool.pixi.workspace]. On a
# new release it opens a pull request that raises that package's ">=" floor and
# bumps [project].version, so Avogadro offers installed copies the update (an
# update reinstalls the plugin and its dependencies from scratch). Every package
# listed needs a ">=" floor. An empty list turns the checks off.
[tool.update-dependencies]
track = ["trexio"]

[tool.avogadro]
minimum-avogadro-version = "2.0.0"

[[tool.avogadro.file-formats]]
identifier = "trexio"
format-name = "TREXIO"
file-extensions = ["h5", "hdf5", "trexio"]
mime-types = ["application/x-trexio"]
description = "Read TREXIO wave function files (HDF5 back end)"
support.read = true
support.write = false
input-mode = "file"
output-format = "cjson"

# NOTE: platforms deliberately omits win-64. trexio publishes no Windows
# wheel on PyPI, and conda-forge has no win-64 build either -- there is
# simply nothing to install there. See README.md "Platform support".
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
avogadro-trexio = { path = ".", editable = true }

[tool.pixi.tasks]
